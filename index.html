</head>

let quiz=[];
let current=0;
let score=0;
let answered=false;
let correctIndex = 0;
const categoryNames={
culture:"Mizo Nunphung",
festival:"Mizo Kut",
food:"Mizo Ei leh In",
history:"Mizoram Chanchin"
};

function startQuiz(){
const cat=document.getElementById("category").value;
const diff=document.getElementById("difficulty").value;

quiz=data.filter(q=>
(cat==="all"||q[0]===cat)&&
(diff==="all"||q[1]===diff)
);

if(quiz.length===0){
alert("Zawhna a awm lo. Thlang dang thlang rawh.");
return;
}

quiz.sort(()=>Math.random()-0.5);
current=0;
score=0;

document.getElementById("start").classList.add("hidden");
document.getElementById("result").classList.add("hidden");
document.getElementById("game").classList.remove("hidden");

showQuestion();
}

function showQuestion(){
answered=false;

const q=quiz[current];
const shuffled=q[3].map((answer,index)=>({
answer:answer,
correct:index===q[4]
}));

shuffled.sort(()=>Math.random()-0.5);
correctIndex=shuffled.findIndex(item=>item.correct);

document.getElementById("question").textContent=q[2];

const options=document.getElementById("answers");
options.innerHTML="";

shuffled.forEach((item,index)=>{
const button=document.createElement("button");
button.className="option";
button.textContent=item.answer;
button.onclick=()=>checkAnswer(index);
options.appendChild(button);
});

document.getElementById("feedback").textContent="";
document.getElementById("explanation").textContent="";
document.getElementById("next").classList.add("hidden");
 }
 function checkAnswer(index){
if(answered)return;
answered=true;

const q=quiz[current];
const buttons=document.querySelectorAll(".option");

buttons.forEach((btn,i)=>{
btn.disabled=true;
if(i===correctIndex)btn.classList.add("correct");
if(i===index && i!==correctIndex)btn.classList.add("wrong");
});

if(index===correctIndex){
score++;
document.getElementById("feedback").textContent="A dik e! 🎉";
}else{
document.getElementById("feedback").textContent=
"A dik lo. Chhanna dik chu: "+q[3][q[4]];
}

document.getElementById("explanation").textContent=q[5];
document.getElementById("bar").style.width=
((current+1)/quiz.length*100)+"%";

const next=document.getElementById("next");
next.textContent=current===quiz.length-1?"Result en rawh":"Zawhna dawt leh";
next.classList.remove("hidden");
 }
 function nextQuestion(){
if(current<quiz.length-1){
current++;
showQuestion();
}else{
showResult();
}
}

function showResult(){
document.getElementById("game").classList.add("hidden");
document.getElementById("result").classList.remove("hidden");

document.getElementById("score").textContent=score+" / "+quiz.length;

let percent=Math.round(score/quiz.length*100);
let message="I bei chho zel rawh!";

if(percent>=90)message="A ropui e! I hriatna a tha hle! 🏆";
else if(percent>=70)message="A tha hle! Chhunzawm zel rawh! 👏";
else if(percent>=50)message="A tha e! Zir chhunzawm zel rawh!";
else message="Bei chho zel rawh. I zir belh thei ang!";

document.getElementById("message").textContent=
message+" I score chu "+percent+"% a ni.";
}
</script>
