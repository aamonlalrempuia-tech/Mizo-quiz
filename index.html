<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mizoram Culture Quiz</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#09203f,#537895);
 color:white;
 text-align:center;
 padding:20px;
}
.container{
 max-width:500px;
 margin:auto;
 background:#ffffff18;
 padding:22px;
 border-radius:20px;
}
h1{color:#ffe082}
button{
 width:100%;
 padding:14px;
 margin:8px 0;
 border:0;
 border-radius:12px;
 font-size:16px;
 font-weight:bold;
 background:#ffca28;
 color:#222;
}
button:hover{background:#fff176}
.option{background:white;color:#222}
#question{font-size:20px;margin:20px 0}
#result{font-size:20px;margin:15px}
select{
 width:100%;padding:12px;
 border-radius:10px;margin:8px 0;
}
</style>
</head>
<body>
<div class="container">
<h1>🌺 MIZORAM CULTURE QUIZ 🌺</h1>
<p>Kan Hnam Nunphung Zirna</p>

<div id="menu">
<h3>Category thlang rawh</h3>
<select id="category">
<option value="all">All Categories</option>
<option value="culture">Mizo Culture</option>
<option value="festival">Festivals</option>
<option value="food">Traditional Food</option>
<option value="history">History</option>
</select>

<select id="level">
<option value="all">All Levels</option>
<option value="easy">Easy</option>
<option value="medium">Medium</option>
<option value="hard">Hard</option>
</select>
<button onclick="startQuiz()">START GAME</button>
</div>

<div id="game" style="display:none">
<p id="progress"></p>
<h3 id="question"></h3>
<div id="answers"></div>
<div id="result"></div>
<button id="next" onclick="nextQuestion()" style="display:none">NEXT ➜</button>
</div>

<div id="finish" style="display:none">
<h2>🎉 Quiz Zawh Fel!</h2>
<h1 id="score"></h1>
<p id="message"></p>
<button onclick="location.reload()">PLAY AGAIN</button>
</div>
</div>

<script>
const questions=[
{c:"culture",l:"easy",q:"Mizo hnam zai hlui ber pakhat chu eng nge?",a:["Hlado","Rock","Jazz","Rap"],x:0},
{c:"culture",l:"easy",q:"Mizo hnam tawng chu eng nge?",a:["Mizo","Hindi","Tamil","Bengali"],x:0},
{c:"festival",l:"easy",q:"Chapchar Kut hi eng tik lai nge hman thin?",a:["Thlasik","Khawzawl","Kum thar","Nipui"],x:3},
{c:"festival",l:"easy",q:"Mim Kut hi eng thlai nen nge inzawm?",a:["Mim","Buh","Vaibel","Hmui"],x:0},
{c:"food",l:"easy",q:"Bai hi eng nge?",a:["Mizo chaw","Silai","In sakna","Hnam zai"],x:0},
{c:"culture",l:"medium",q:"Mizo hnam nunphungah Tlawmngaihna chu eng nge?",a:["Mahni chauh ngaihtuahna","Mi dang tanpui leh inpekna","Sum lakna","Inthlahdahna"],x:1},
{c:"history",l:"medium",q:"Mizoram statehood a lo chang kum chu eng nge?",a:["1972","1987","1990","2000"],x:1},
{c:"festival",l:"medium",q:"Pawl Kut hi eng thil nen nge inzawm?",a:["Buh thar","Thing chhuah","Sava","Tuipui"],x:0},
{c:"food",l:"medium",q:"Sawhchiar-ah eng thil nge tel thin?",a:["Buh leh sa","Cake","Bread","Noodles"],x:0},
{c:"history",l:"hard",q:"Mizoram statehood a lo chang ni chu eng ni nge?",a:["20 February","15 August","26 January","1 December"],x:0},
{c:"culture",l:"hard",q:"Mizo hnam zai leh lam hriat lar tak chu eng nge?",a:["Cheraw","Bharatanatyam","Kathak","Bhangra"],x:0},
{c:"festival",l:"hard",q:"Chapchar Kut hian eng thil nge lawm?",a:["Ram lo paih zawh hnu","Buh seng zawh","Kum thar","Thingtlang"],x:0}
];

let list=[],index=0,points=0,answered=false;

function startQuiz(){
 let c=document.getElementById("category").value;
 let l=document.getElementById("level").value;
 list=questions.filter(q=>(c==="all"||q.c===c)&&(l==="all"||q.l===l));
 if(!list.length)return;
 list.sort(()=>Math.random()-.5);
 index=0;points=0;
 document.getElementById("menu").style.display="none";
 document.getElementById("game").style.display="block";
 showQuestion();
}

function showQuestion(){
 answered=false;
 let q=list[index];
 document.getElementById("progress").innerText=
 "Question "+(index+1)+" / "+list.length+" | Score: "+points;
 document.getElementById("question").innerText=q.q;
 document.getElementById("result").innerText="";
 document.getElementById("next").style.display="none";
 let html="";
 q.a.forEach((a,i)=>{
 html+=`<button class="option" onclick="checkAnswer(${i})">${a}</button>`;
 });
 document.getElementById("answers").innerHTML=html;
}

function checkAnswer(i){
 if(answered)return;
 answered=true;
 let q=list[index];
 let buttons=document.querySelectorAll(".option");
 buttons.forEach((b,j)=>{
 b.disabled=true;
 if(j===q.x)b.style.background="#81c784";
 if(j===i&&i!==q.x)b.style.background="#ef9a9a";
 });
 if(i===q.x){
 points++;
 document.getElementById("result").innerText="🎉 Dik tak!";
 }else{
 document.getElementById("result").innerText="❌ Dik lo. Answer: "+q.a[q.x];
 }
 document.getElementById("next").style.display="block";
 document.getElementById("next").innerText=
 index===list.length-1?"FINISH":"NEXT ➜";
}

function nextQuestion(){
 index++;
 if(index<list.length){
 showQuestion();
 }else{
 document.getElementById("game").style.display="none";
 document.getElementById("finish").style.display="block";
 document.getElementById("score").innerText=points+" / "+list.length;
 document.getElementById("message").innerText=
 points===list.length?"Excellent! Mizo hnam nunphung i hre tha hle!":"Zir chhunzawm zel rawh!";
 }
}
</script>
</body>
  </html>
